[project]
name = "dbt-snowflake-parquet-direct-tests"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "dbt-core>=1.12,<1.13",
    "dbt-duckdb>=1.11,<1.12",
]

[tool.uv]
package = false

# Used only by integration_tests_snowflake/, which needs a Snowflake account and an S3 bucket.
[dependency-groups]
snowflake = [
    "dbt-snowflake>=1.10",
    "boto3>=1.35",
    "pyarrow>=18",
    "pytest>=8",
]
