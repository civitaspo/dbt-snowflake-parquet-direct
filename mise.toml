[tools]
"aqua:astral-sh/uv" = "0.13.1"
"aqua:jdx/jactionlint" = "2.6.0"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:suzuki-shunsuke/ghalint" = "1.5.6"
"aqua:suzuki-shunsuke/pinact" = "4.1.1"
"aqua:suzuki-shunsuke/disable-checkout-persist-credentials" = "1.0.0"
"aqua:ast-grep/ast-grep" = "0.51.2"

[tasks.lint]
run = "jactionlint --shellcheck=shellcheck && pinact run --check && ghalint run"

[tasks.fix]
run = "pinact run && disable-checkout-persist-credentials"

[tasks.test]
run = "uv sync --frozen && uv run dbt deps --project-dir integration_tests --profiles-dir integration_tests && uv run dbt parse --project-dir integration_tests --profiles-dir integration_tests"
