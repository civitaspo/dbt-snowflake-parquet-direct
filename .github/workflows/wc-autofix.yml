name: autofix (workflow_call)

on:
  workflow_call:
    secrets:
      CSM_CI_CLIENT_APP_PRIVATE_KEY:
        required: false

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Forbid CHANGELOG edits outside release/next
        if: ${{ !(github.head_ref == 'release/next' && github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed_files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- CHANGELOG.md)
          if [[ -n "$changed_files" ]]; then
            echo "CHANGELOG.md is owned by the release PR. Use Conventional Commit subjects on feature PRs." >&2
            exit 1
          fi

      - name: Set up mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: "2026.11.12"
          install_args: "--locked"
          cache: true

      - name: Run automatic fixes
        run: mise run fix

      - name: Request workflow security fixes
        uses: civitaspo/csm-ci-actions/actions/client/securefix@ade91284ea6a0f95aec6186588541cfbc5704482 # v0.9.0
        with:
          client-id: ${{ vars.CSM_CI_CLIENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_CLIENT_APP_PRIVATE_KEY }}
          server-repository: ${{ vars.CSM_CI_SERVER_REPOSITORY }}
