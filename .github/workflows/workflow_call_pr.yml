name: PR checks (workflow_call)

on:
  workflow_call:
    secrets:
      CSM_CI_CLIENT_APP_PRIVATE_KEY:
        required: false

permissions: {}

jobs:
  lint:
    uses: ./.github/workflows/wc-lint.yml
    permissions:
      contents: read

  tests:
    uses: ./.github/workflows/wc-tests.yml
    permissions:
      contents: read

  autofix:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'civitaspo' }}
    uses: ./.github/workflows/wc-autofix.yml
    permissions:
      contents: read
    secrets:
      CSM_CI_CLIENT_APP_PRIVATE_KEY: ${{ secrets.CSM_CI_CLIENT_APP_PRIVATE_KEY }}
